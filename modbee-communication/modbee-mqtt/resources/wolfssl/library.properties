name=wolfssl
version=5.9.2
author=wolfSSL Inc.
maintainer=ModBee <info@modbee.org>
sentence=TLS for ModBee MQTT, vendored from wolfSSL.
paragraph=The engine MQTT_CLIENT and MQTT_BROKER use to speak TLS and to generate a certificate of their own. Vendored so a project needs nothing installed; see internal/sync-wolfssl.sh. wolfSSL is GPLv3 - see COPYING and LICENSING.
category=Communication
url=https://github.com/wolfSSL/wolfssl
architectures=*

# THE ONE DEFINE THE WHOLE LIBRARY DEPENDS ON, and wolfSSL's own Arduino
# documentation says it in those words: "the WOLFSSL_USER_SETTINGS macro must
# be defined project-wide". Its wolfcrypt/settings.h reads user_settings.h only
# when this is set, so without it every source here compiles with wolfSSL's
# DEFAULT features instead of the ones it was vendored for - no OpenSSL
# compatibility layer, no certificate generation, no key generation.
#
# Nothing fails at compile time. The objects are produced and the shared object
# links, because a .so may carry undefined symbols; the failure arrives when
# the runtime loads the program, as `undefined symbol: wolfSSL_CTX_get_cert_store`.
#
# `defines=` is read by the Runtime's build (scripts/Makefile.strucpp). It is
# not an Arduino key, and arduino-cli ignores keys it does not know, so this
# file stays a valid Arduino library descriptor.
defines=WOLFSSL_USER_SETTINGS
