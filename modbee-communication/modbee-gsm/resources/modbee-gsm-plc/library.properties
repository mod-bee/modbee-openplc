name=ModBee GSM PLC
version=0.1.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=The one modem an OpenPLC program has, for the modbee-gsm blocks and for MQTT over cellular.
paragraph=Owns the single GsmDevice, its serial link and its power lines, serialises every task's access to it with one lock, keeps the SMS inbox, and offers GsmPlcClient - a GsmClient that takes the lock - so MQTT_CLIENT can use the modem as it uses WiFi.
category=Communication
url=https://github.com/mod-bee/modbee-gsm
architectures=*
includes=ModBeeGsmPlc.h
