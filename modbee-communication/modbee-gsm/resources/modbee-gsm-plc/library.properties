name=ModBee GSM PLC
version=0.2.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=The one modem an OpenPLC program has, for the modbee-gsm blocks and for MQTT over cellular.
paragraph=Owns the single device a modem block makes (holding only its module's driver), its serial link and its power lines, serialises every task's access to it with one lock, keeps the SMS inbox, does the modem blocks' methods, and offers GsmPlcClient - an Arduino Client that takes the lock - so FB_MqttClient can use the modem as it uses WiFi.
category=Communication
url=https://github.com/mod-bee/modbee-gsm
architectures=*
includes=ModBeeGsmPlc.h
