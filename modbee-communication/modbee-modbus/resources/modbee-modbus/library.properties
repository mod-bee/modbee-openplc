name=ModBee Modbus
version=0.1.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=Modbus RTU, ASCII and TCP - client and server - that never blocks.
paragraph=One object, one poll() in your loop, and your variables are the registers. Reads and writes queue, duplicates are dropped, a repeated write sends only the value you settled on, and every request reaches exactly one conclusion. Covers every common function code including mask write, read/write multiple and device identification, with typed 32 and 64-bit values in all four word orders.
category=Communication
url=https://github.com/mod-bee/modbee-modbus
architectures=esp32,esp8266,samd,mbed,rp2040,stm32,renesas_uno
includes=ModBeeModbus.h

# A node needs roughly 2 KB of RAM per link before any application data: an
# assembly buffer, a transmit buffer and the operation queue. That rules out
# the 8-bit AVR boards, which is why they are not listed above.
