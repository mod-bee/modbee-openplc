name=ModBeeNodeUIO
version=2.0.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=Board support for the ModBee Node UIO.
paragraph=Digital and analog I/O, HAT power switching, the network, sleep and wake, and a controlled restart for the ESP32-S3 based Node UIO. Retained variables use the firmware's own store. Hardware only: the ADS1115 ADC and GP8413 DAC drivers travel with it, and no communication protocol is built in.
category=Signal Input/Output
url=https://github.com/mod-bee/modbee-node-uio
architectures=esp32
includes=NodeUioAPI.h

# Platform libraries the sources use.
#
# Load bearing, not decoration. A consuming project precompiles this library
# and moves its sources aside before linking, so nothing the build can still
# scan mentions these; the editor emits an include for each of them into the
# sketch on the strength of this line. Without it the archive compiles and then
# fails to link.
depends=Wire,Preferences,WiFi
