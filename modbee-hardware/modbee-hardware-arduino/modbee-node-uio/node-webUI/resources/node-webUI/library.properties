name=NodeWebUI
version=0.1.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=Web interface for the ModBee Node UIO.
paragraph=Serves a live view of the board's I/O and its analog calibration over HTTP and a WebSocket. Reads and writes the board through NodeUioAPI, so it cannot disagree with the rest of the firmware about what a value means. It does not bring a network up; something else owns the radio and this binds a port on it.
category=Communication
